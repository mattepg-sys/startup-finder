<title>Startup Finder Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a deal-desk radar. Summary strip first, then a filterable wall of opportunity cards that open into full dossiers. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --fg:#14202e; --muted:#5a6878; --line:#d6dde6;
  --accent:#1f4fd1; --accent-ink:#ffffff;
  --l-free:#14804a; --l-diff:#1f4fd1; --l-trans:#7a3fc4; --l-watch:#66758a; --l-block:#b4232f;
  --l-free-bg:#e3f4ea; --l-diff-bg:#e5ecfc; --l-trans-bg:#f0e8fa; --l-watch-bg:#eceff3; --l-block-bg:#fbe7e8;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surface:#151d28; --sunk:#1b2533; --fg:#e6ecf3; --muted:#93a1b3; --line:#2a3646;
  --accent:#7ea2ff; --accent-ink:#0e141c;
  --l-free:#5ccf8f; --l-diff:#7ea2ff; --l-trans:#b991f0; --l-watch:#9aa8ba; --l-block:#f07a83;
  --l-free-bg:#16301f; --l-diff-bg:#1a2647; --l-trans-bg:#2a1f40; --l-watch-bg:#222c39; --l-block-bg:#3a1a1e;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#151d28; --sunk:#1b2533; --fg:#e6ecf3; --muted:#93a1b3; --line:#2a3646;
  --accent:#7ea2ff; --accent-ink:#0e141c;
  --l-free:#5ccf8f; --l-diff:#7ea2ff; --l-trans:#b991f0; --l-watch:#9aa8ba; --l-block:#f07a83;
  --l-free-bg:#16301f; --l-diff-bg:#1a2647; --l-trans-bg:#2a1f40; --l-watch-bg:#222c39; --l-block-bg:#3a1a1e;
  color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:22px}
a{color:var(--accent)} a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,4.4vw,44px)/1.08 var(--font-display);margin:6px 0 8px;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:68ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font:600 13px/1.2 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-size:18px;margin-right:4px}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px/1 var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tools .right{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=search]{font:14px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:16px;align-items:start}
.card:has(details[open]){grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:700 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px}
.meta{font:12px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.card h2{font:700 22px/1.15 var(--font-display);margin:0}
.card h2 a{color:inherit;text-decoration:none} .card h2 a:hover{text-decoration:underline}
.oneliner{margin:0}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;border:1px solid var(--line);color:var(--fg);background:var(--sunk)}
.badge.ev.thin{color:var(--l-block);border-color:var(--l-block)}
.badge.ev.solid{color:var(--l-free);border-color:var(--l-free)}
.bm{margin:0;font-size:14px}
.bm strong{font:600 11px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.backers{font-size:13px;color:var(--muted);margin:0}
.tag{font:700 10px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 5px;border-radius:4px;background:var(--surface);color:var(--muted);border:1px solid var(--line);vertical-align:1px}
.secret{background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0;font-size:14px}
.secret strong,.best strong{display:block;font:600 11px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.best{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0;font-size:14px}
.scores{max-width:560px;display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:12px}
.scores .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.scores .bar i{display:block;height:100%;background:var(--accent)}
.scores .n{font:600 12px var(--font-mono);font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";font-family:var(--font-mono)} details[open] summary::before{content:"− "}
.sec{margin-top:14px;display:grid;gap:6px}
.sec h3{font:600 12px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec ul{margin:0;padding-left:18px;display:grid;gap:6px}
.sec p{margin:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
@media (max-width:560px){.tbl thead{display:none}.tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}.tbl tr{border-bottom:1px solid var(--line);padding:8px 0}.tbl td{border:0;padding:2px 0}.tbl td:nth-child(2)::before{content:attr(data-h) ": ";font-weight:600}.tbl td:nth-child(3)::before{content:attr(data-h) ": ";font-weight:600}}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th{font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sev{font:700 10px/1 var(--font-mono);padding:3px 6px;border-radius:4px;text-transform:uppercase;margin-right:6px}
.sev.alta,.sev.high{background:var(--l-block-bg);color:var(--l-block)} .sev.media,.sev.medium{background:var(--l-watch-bg);color:var(--fg)} .sev.bassa,.sev.low{background:var(--l-free-bg);color:var(--l-free)}
.q li{font-style:italic}
.test{background:var(--l-free-bg);border-radius:8px;padding:10px 12px}
.src{font-size:12px;color:var(--muted)} .src a{word-break:break-word}
.fb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fb button{font:600 12px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer}
.fb button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
.top{display:grid;gap:10px}
.top h2{font:700 20px/1.2 var(--font-display);margin:0}
.top ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.top li{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:6px;min-width:0}
.top li a{font:700 17px/1.2 var(--font-display);color:var(--fg);text-decoration:none}
.top li a:hover{text-decoration:underline}
.top .why{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:13px;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px}
footer code{font-family:var(--font-mono);font-size:12px}
.btn{font:600 13px var(--font-body);border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:7px 12px;cursor:pointer}
@media (prefers-reduced-motion: no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Startup Finder · __RUN__</div>
    <h1 id="h1">Opportunity radar</h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="dist" id="dist" aria-hidden="true"></div>
  <div class="tools">
    <div class="legend" id="filters" role="group" aria-label="Filter"></div>
    <div class="right">
      <input type="search" id="q" placeholder="Search…" aria-label="Search">
      <select id="sort" aria-label="Sort"></select>
    </div>
  </div>
  <section id="top" class="top" aria-label="Where to start"></section>
  <main class="grid" id="grid"></main>
  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const L = (DATA && DATA.meta && DATA.meta.lang) || "en";
const TT = {
 it:{h1:"Radar delle opportunità",lede:"Cosa hanno appena finanziato i migliori investitori individuali, perché funziona, cosa esiste già in Europa e dove puoi ancora giocare. Non sono verdetti: sono spunti da cui partire.",
  people:"investitori",deals:"deal analizzati",cards:"schede",min:"minuti",all:"Tutte",search:"Cerca…",
  sort:{early:"Più giovani prima",signal:"Segnale investitori",insight:"Insight",space:"Spazio libero",feasibility:"Fattibilità",differentiation:"Differenziazione"},
  secret:"Il segreto",best:"Miglior angolo",open:"Apri la scheda completa",europe:"Europa oggi",who:"Chi",what:"Cosa fa",miss:"Cosa non fa",
  angles:"Angoli di differenziazione",transfers:"Trasferibile a",risks:"Rischi da conoscere",questions:"Domande per te",edge:"Il tuo vantaggio",
  test:"Test da 1 settimana",signal:"segnale",cost:"costo",sources:"Fonti",useful:"Utile",notuseful:"Non utile",fbq:"Questa scheda ti è utile?",
  copy:"Copia il feedback",start:"Da dove partire",bm:"Modello di business",mat:{angel:"Angel",pre_seed:"Pre-seed",accelerator:"Acceleratore",seed_young:"Seed giovane",seed:"Seed"},ev:{solid:"Prove solide",partial:"Prove parziali",thin:"Prove scarse"},copied:"Feedback copiato: incollalo nella chat del progetto",none:"Nessuna scheda corrisponde al filtro.",
  sc:{insight:"Insight",transferability:"Trasferibilità",space:"Spazio",differentiation:"Differenziazione",feasibility:"Fattibilità",personal_fit:"Fit personale"},
  backed:"Finanziata da",foot:"Le etichette orientano, non bocciano. Ogni fatto ha una fonte; le stime e le ipotesi sono segnate come tali. Generato da",
  labels:{OPEN_SPACE:"Spazio libero",DIFFERENTIABLE:"Differenziabile",TRANSFERABLE:"Trasferibile",WATCH:"Da osservare",BLOCKED:"Bloccato"}},
 en:{h1:"Opportunity radar",lede:"What top individual investors just backed, why it works, what already exists in Europe, and where you can still play. These are starting points, not verdicts.",
  people:"investors",deals:"deals analysed",cards:"cards",min:"minutes",all:"All",search:"Search…",
  sort:{early:"Earliest first",signal:"Investor signal",insight:"Insight",space:"Open space",feasibility:"Feasibility",differentiation:"Differentiation"},
  secret:"The secret",best:"Best angle",open:"Open the full card",europe:"Europe today",who:"Who",what:"What they do",miss:"What they miss",
  angles:"Differentiation angles",transfers:"Transferable to",risks:"Risks to know",questions:"Questions for you",edge:"Your edge",
  test:"One-week test",signal:"signal",cost:"cost",sources:"Sources",useful:"Useful",notuseful:"Not useful",fbq:"Is this card useful?",
  copy:"Copy feedback",start:"Where to start",bm:"Business model",mat:{angel:"Angel",pre_seed:"Pre-seed",accelerator:"Accelerator",seed_young:"Young seed",seed:"Seed"},ev:{solid:"Solid evidence",partial:"Partial evidence",thin:"Thin evidence"},copied:"Feedback copied: paste it into the project chat",none:"No card matches the filter.",
  sc:{insight:"Insight",transferability:"Transferability",space:"Space",differentiation:"Differentiation",feasibility:"Feasibility",personal_fit:"Personal fit"},
  backed:"Backed by",foot:"Labels guide, they don't veto. Every fact has a source; estimates and hypotheses are marked. Generated by",
  labels:{OPEN_SPACE:"Open space",DIFFERENTIABLE:"Differentiable",TRANSFERABLE:"Transferable",WATCH:"Watch",BLOCKED:"Blocked"}}
};
const T = TT[L] || TT.en;
const LBL = {OPEN_SPACE:"free",DIFFERENTIABLE:"diff",TRANSFERABLE:"trans",WATCH:"watch",BLOCKED:"block"};
const ORDER = ["OPEN_SPACE","DIFFERENTIABLE","TRANSFERABLE","WATCH","BLOCKED"];
const LEGACY = {SPAZIO_LIBERO:"OPEN_SPACE",DIFFERENZIABILE:"DIFFERENTIABLE",TRASFERIBILE:"TRANSFERABLE",DA_OSSERVARE:"WATCH",BLOCCATO:"BLOCKED"};
const clean = s => String(s ?? "").replace(/\s*\[[^\]\n]{0,60}?\bC\d+\b[^\]\n]{0,60}\]/g,"").trim();
const esc0 = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc = s => esc0(clean(s));
const hyp = s => { const t = clean(s); const m = t.match(/^(IPOTESI|HYPOTHESIS|STIMA|ESTIMATE)\s*[:\-]\s*/i); return m ? `<span class="tag">${esc0(m[1].toLowerCase())}</span> ${esc0(t.slice(m[0].length))}` : esc0(t); };
const store = { get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const KEY = "sf-" + DATA.meta.run;
let state = { label: store.get(KEY+"-label","ALL"), sort: store.get(KEY+"-sort","early"), q:"" };
let fb = store.get(KEY+"-fb",{});
const cards = (DATA.cards || []).map(c => (c.label = LEGACY[c.label] || c.label, c));
const color = l => `var(--l-${LBL[l]||"watch"})`, bg = l => `var(--l-${LBL[l]||"watch"}-bg)`;
const fmtUsd = n => n ? (n>=1e6 ? "$"+(n/1e6).toFixed(n>=1e7?0:1)+"M" : "$"+Math.round(n/1e3)+"k") : "";

function header(){
  document.getElementById("h1").textContent = T.h1;
  document.getElementById("lede").textContent = T.lede;
  const m = DATA.meta, s = [];
  if (m.people) s.push(`<span><b>${m.people}</b>${T.people}</span>`);
  s.push(`<span><b>${m.deals}</b>${T.deals}</span>`);
  if (m.minutes) s.push(`<span><b>${m.minutes}</b>${T.min}</span>`);
  s.push(`<span>${esc(m.generated)}</span>`);
  document.getElementById("stats").innerHTML = s.join("");
  const counts = Object.fromEntries(ORDER.map(l => [l, cards.filter(c => c.label===l).length]));
  document.getElementById("dist").innerHTML = ORDER.filter(l=>counts[l]).map(l => `<span style="width:${100*counts[l]/Math.max(1,cards.length)}%;background:${color(l)}" title="${esc(T.labels[l])}: ${counts[l]}"></span>`).join("");
  const f = [`<button class="chip" data-l="ALL" aria-pressed="${state.label==="ALL"}">${T.all} · ${cards.length}</button>`]
    .concat(ORDER.filter(l=>counts[l]).map(l => `<button class="chip" data-l="${l}" aria-pressed="${state.label===l}"><span class="dot" style="background:${color(l)}"></span>${esc(T.labels[l])} · ${counts[l]}</button>`));
  const fe = document.getElementById("filters"); fe.innerHTML = f.join("");
  fe.querySelectorAll("button").forEach(b => b.onclick = () => { state.label=b.dataset.l; store.set(KEY+"-label",state.label); header(); render(); });
  const so = document.getElementById("sort");
  so.innerHTML = Object.entries(T.sort).map(([k,v]) => `<option value="${k}" ${state.sort===k?"selected":""}>${esc(v)}</option>`).join("");
  so.onchange = () => { state.sort = so.value; store.set(KEY+"-sort",state.sort); render(); };
  const q = document.getElementById("q"); q.placeholder = T.search; q.oninput = () => { state.q = q.value.toLowerCase(); render(); };
}
function scoreVal(c,k){ return (c.scores && c.scores[k] && c.scores[k].score) || 0 }
function card(c){
  const l = c.label, co = c.company || {}, sc = c.scores || {};
  const backers = (co.backers||[]).map(b => esc(b.name)+(b.role?` <span class="meta">(${esc(String(b.role).replace(/_/g," "))})</span>`:"")).join(", ");
  const meta = [co.stage && String(co.stage).replace("_","-"), co.round_date, fmtUsd(co.amount_usd), co.hq].filter(x => x && !/^\s*unknown/i.test(String(x))).map(esc).join(" · ");
  const bars = Object.keys(T.sc).filter(k => sc[k] && sc[k].score).map(k => `<span>${esc(T.sc[k])}</span><span class="bar"><i style="width:${sc[k].score*20}%"></i></span><span class="n" title="${esc(sc[k].why||"")}">${sc[k].score}/5</span>`).join("");
  const a0 = (c.angles||[])[0];
  const eu = (c.europe_today||[]).filter(e=>e&&e.name);
  const euT = eu.length ? `<div class="tbl"><table><thead><tr><th>${T.who}</th><th>${T.what}</th><th>${T.miss}</th></tr></thead><tbody>${eu.map(e=>`<tr><td>${e.website?`<a href="${esc(e.website)}" target="_blank" rel="noopener">${esc(e.name)}</a>`:esc(e.name)}<div class="meta">${esc([e.country,e.scale].filter(x => x && !/^\s*unknown\s*$/i.test(String(x))).join(" · "))}</div></td><td data-h="${T.what}">${esc(e.what_they_do)}</td><td data-h="${T.miss}">${esc(e.what_they_miss)}</td></tr>`).join("")}</tbody></table></div>` : `<p>—</p>`;
  const angles = (c.angles||[]).map(a=>`<li><strong>${esc(a.title)}</strong> — ${esc(a.for_whom)}. ${esc(a.why_gap)}${a.evidence?` <span class="meta">${esc(a.evidence)}</span>`:""}</li>`).join("");
  const tr = (c.transfers||[]).map(t=>`<li><strong>${esc(t.sector)}</strong> — ${esc(t.how)} ${esc(t.why_promising||"")}</li>`).join("");
  const rk = (c.risks||[]).map(r=>`<li><span class="sev ${esc(r.severity)}">${esc(r.severity)}</span>${esc(r.risk)}</li>`).join("");
  const qs = (c.questions||[]).filter(Boolean).map(q=>`<li>${esc(q)}</li>`).join("");
  const t = c.one_week_test || {};
  const src = (c._sources||[]).map(s=>`<li>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)} <span class="meta">${esc(s.label||"")} ${esc(s.date||"")}</span></li>`).join("");
  const v = fb[c._slug];
  return `<article class="card" id="c-${esc(c._slug)}">
    <div class="card-top"><span class="pill" style="background:${bg(l)};color:${color(l)}">${esc(T.labels[l]||l)}</span><span class="meta">${meta}</span></div>
    <h2>${co.website?`<a href="${esc(co.website)}" target="_blank" rel="noopener">${esc(co.name)}</a>`:esc(co.name)}</h2>
    ${(c.maturity||c.evidence_level)?`<div class="badges">${c.maturity?`<span class="badge mat">${esc((T.mat||{})[c.maturity]||c.maturity)}</span>`:""}${c.evidence_level?`<span class="badge ev ${esc(c.evidence_level)}">${esc((T.ev||{})[c.evidence_level]||c.evidence_level)}</span>`:""}</div>`:""}
    <p class="oneliner">${esc(c.one_liner)}</p>
    ${c.business_model?`<p class="bm"><strong>${T.bm}</strong> ${hyp(c.business_model)}</p>`:""}
    ${backers?`<p class="backers">${T.backed} ${backers}${c._signal?` · <span class="meta">signal ${c._signal}</span>`:""}</p>`:""}
    <p class="secret"><strong>${T.secret}</strong>${hyp(c.secret && c.secret.text)}</p>
    ${a0?`<p class="best"><strong>${T.best}</strong>${esc(a0.title)} — ${esc(a0.for_whom)}</p>`:""}
    <div class="scores">${bars}</div>
    <details><summary>${T.open}</summary>
      <div class="sec"><h3>${T.europe}</h3>${euT}</div>
      <div class="sec"><h3>${T.angles}</h3><ul>${angles}</ul></div>
      <div class="sec"><h3>${T.transfers}</h3><ul>${tr}</ul></div>
      <div class="sec"><h3>${T.risks}</h3><ul>${rk}</ul></div>
      <div class="sec q"><h3>${T.questions}</h3><ul>${qs}</ul></div>
      ${c.your_edge?`<div class="sec"><h3>${T.edge}</h3><p>${esc(c.your_edge)}</p></div>`:""}
      <div class="sec"><h3>${T.test}</h3><p class="test">${esc(t.what)}<br><span class="meta">${T.signal}: ${esc(t.signal)}${t.cost_eur!=null?` · ${T.cost}: €${esc(t.cost_eur)}`:""}</span></p></div>
      ${src?`<div class="sec src"><h3>${T.sources}</h3><ul>${src}</ul></div>`:""}
    </details>
    <div class="fb"><span>${T.fbq}</span>
      <button data-s="${esc(c._slug)}" data-v="1" aria-pressed="${v===1}">${T.useful}</button>
      <button data-s="${esc(c._slug)}" data-v="-1" aria-pressed="${v===-1}">${T.notuseful}</button></div>
  </article>`;
}
function render(){
  let list = cards.filter(c => state.label==="ALL" || c.label===state.label);
  if (state.q) list = list.filter(c => JSON.stringify(c).toLowerCase().includes(state.q));
  const k = state.sort;
  const MR = {angel:0,pre_seed:0,accelerator:0,seed_young:1,seed:2};
  list.sort((a,b) => k==="early" ? ((MR[a.maturity]??3)-(MR[b.maturity]??3)) || ((b._signal||0)-(a._signal||0)) : k==="signal" ? ((b._signal||0)-(a._signal||0)) || (ORDER.indexOf(a.label)-ORDER.indexOf(b.label)) : scoreVal(b,k)-scoreVal(a,k));
  const g = document.getElementById("grid");
  g.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">${T.none}</div>`;
  g.querySelectorAll(".fb button").forEach(b => b.onclick = () => { const s=b.dataset.s, v=+b.dataset.v; fb[s] = fb[s]===v?0:v; store.set(KEY+"-fb",fb); render(); });
}
function footer(){
  const f = document.getElementById("foot");
  f.innerHTML = `<div>${T.foot} <code>tools/build_report.py</code> · ${esc(DATA.meta.run)}</div>
   <div><button class="btn" id="copyfb">${T.copy}</button> <span id="copymsg" class="meta"></span></div>
   <textarea id="fbtext" readonly hidden rows="3" style="width:100%"></textarea>`;
  document.getElementById("copyfb").onclick = async () => {
    const txt = JSON.stringify({run: DATA.meta.run, feedback: fb});
    try { await navigator.clipboard.writeText(txt); document.getElementById("copymsg").textContent = T.copied; }
    catch(e){ const ta=document.getElementById("fbtext"); ta.hidden=false; ta.value=txt; ta.select(); }
  };
}
function renderTop(){
  const pick = cards.filter(c => c.label!=="BLOCKED").map(c => ({c, v: scoreVal(c,"space")+scoreVal(c,"differentiation")+scoreVal(c,"feasibility")+scoreVal(c,"insight")}))
    .sort((a,b)=>b.v-a.v).slice(0,3);
  const el = document.getElementById("top");
  if (!pick.length) { el.hidden = true; return; }
  el.innerHTML = `<h2>${T.start}</h2><ol>${pick.map(({c}) => { const a=(c.angles||[])[0]||{}; return `<li><span class="pill" style="background:${bg(c.label)};color:${color(c.label)};justify-self:start">${esc(T.labels[c.label])}</span><a href="#c-${esc(c._slug)}">${esc(c.company&&c.company.name)}</a><span>${esc(a.title)}</span><span class="why">${esc(a.for_whom)}</span></li>`}).join("")}</ol>`;
}
header(); renderTop(); render(); footer();
</script>
